<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Francine T. Ozereko — Ceramicist</title>
  <meta name="description" content="Francine T. Ozereko — ceramicist and studio potter. Sgraffito porcelain, birds, sky studies. Pelham, Massachusetts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      color: #0a0a0a;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      display: block;
      height: 3px;
      background: #0a0a0a;
    }
    .landing {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 32px 64px;
      text-align: center;
    }
    .landing-name {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 0.01em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .landing-tagline {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      color: #3a3a3a;
      margin-bottom: 48px;
      line-height: 1.5;
    }
    .landing-image {
      margin-bottom: 48px;
    }
    .landing-image img {
      max-width: 100%;
      max-height: 60vh;
      display: block;
      margin: 0 auto;
    }
    .landing-desc {
      max-width: 560px;
      margin: 0 auto 36px;
      font-size: 14px;
      color: #3a3a3a;
      line-height: 1.7;
    }
    .landing-contact {
      font-size: 13px;
      letter-spacing: 0.03em;
      color: #8a8a8a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .landing-email {
      display: inline-block;
      font-size: 15px;
      color: #0a0a0a;
      border-bottom: 1px solid #0a0a0a;
      transition: opacity 0.2s;
    }
    .landing-email:hover { opacity: 0.6; }
    .landing-note {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bbbbbb;
    }
  </style>
</head>
<body>

  <div class="landing">
    <h1 class="landing-name">Francine T. Ozereko</h1>
    <p class="landing-tagline">Ceramicist — sgraffito porcelain, birds, sky journal.</p>

    <div class="landing-image">
      <img src="images/home/02.jpg" alt="Sgraffito ceramic work by Francine T. Ozereko" />
    </div>

    <p class="landing-desc">
      Working from a studio in Pelham, Massachusetts for more than four decades.
      Functional ceramics and sculptural birds, carved in sgraffito porcelain.
    </p>
    <div class="landing-contact">Inquiries &amp; Commissions</div>
    <a href="mailto:ozerekostudios@gmail.com" class="landing-email">ozerekostudios@gmail.com</a>
    <div class="landing-note">Full site coming soon</div>
  </div>

</body>
</html>
